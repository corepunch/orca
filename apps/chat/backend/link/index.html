<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Open ORCA Chat</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff;
         font: 17px/1.4 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 22rem; padding: 2rem; }
  h1 { font-weight: 300; font-size: 2.4rem; margin: 0 0 1rem; text-transform: lowercase; }
  a { display: block; margin-top: 1.5rem; padding: .9rem; text-align: center; background: #0084ff; color: #fff;
      text-decoration: none; font-weight: 600; border-radius: 6px; }
  p { color: #b3b3b3; }
</style>
</head>
<body>
<main>
  <h1>Open chat</h1>
  <p>Signing you in to ORCA Chat on this device. If nothing happens, tap the button.</p>
  <a id="open" href="#">Open ORCA Chat</a>
</main>
<script>
// Forwards Appwrite's magic-link query (userId, secret) to the app's scheme.
// Email clients may refuse custom-scheme links, so the email points here.
// Set CHAT_MAGIC_LINK_URL to this page's https address; keep the project ID
// in step with apps/chat/config.lua.
const project = '69f1c06800389dc6a1a0';
const query = new URLSearchParams(location.search);
const forward = new URLSearchParams();
for (const key of ['userId', 'secret']) if (query.get(key)) forward.set(key, query.get(key));
const target = `appwrite-callback-${project}://magic?${forward}`;
document.getElementById('open').href = target;
// Drop the secret from history before leaving the page.
history.replaceState(null, '', location.pathname);
if (forward.has('secret')) location.href = target;
</script>
</body>
</html>
