name: Deploy to GitHub Pages

on:
  # Trigger on push to the main branch
  push:
    branches:
      - main

  # Allow manual workflow dispatch
  workflow_dispatch:

  # Validate the complete site and demo before merging workflow changes.
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. However, do NOT cancel
# in-progress runs as we want to allow these production deployments
# to complete.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libxml2-dev

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Build WASM dependencies (lua5.4, libxml2, liblz4)
        run: emmake make wasm-deps

      - name: Build platform library for WebGL
        run: |
          mkdir -p build/lib
          emmake make -C libs/platform OUTDIR=../../build/lib

      - name: Generate C, Lua and XML API docs
        run: |
          make -C tools documentation
          cp QUICKSTART.md docs/quickstart.md

      - name: Build documentation site
        run: mkdocs build

      - name: Build WebGL demo (Example project)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          emmake make webgl-debug-demo WEBGL_EMCC=emcc WEBGL_VERSION="Build #${{ github.run_number }} (${SHORT_SHA})"

      - name: Copy WebGL demo into site
        run: |
          mkdir -p site/demo
          cp -r build/webgl/. site/demo/

      - name: Verify publication files
        run: |
          test -s site/index.html
          test -s site/quickstart/index.html
          test -s site/schemas/cgen.dtd
          for language in c lua xml; do
            for module in core geometry filesystem UIKit SceneKit SpriteKit renderer; do
              test -s "site/generated/$language/$module/overview/index.html"
            done
          done
          for file in orca.html orca.js orca.wasm orca.data; do
            test -s "site/demo/$file"
            cmp "build/webgl/$file" "site/demo/$file"
          done

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the MkDocs-generated site directory
          path: 'site'

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
