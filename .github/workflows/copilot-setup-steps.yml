name: "Copilot Setup Steps"

# Copilot runs this job by name; validate changes manually.
on:
  workflow_dispatch:

jobs:
  # Job name MUST be `copilot-setup-steps` — Copilot picks it up by name.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # needed for checkout + submodule init

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── System libraries required by the C build ──────────────────────────
      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            xvfb

      # ── MkDocs (docs preview) ──────────────────────────────────────────────
      - name: Install MkDocs Material (docs build)
        run: pip install mkdocs-material
