name: Build

# Pull requests and main run two Linux checks: the engine build and the test
# suites. Per-platform engine packages are built on release (release.yml).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev

      - name: Build
        run: make

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The engine builds Lua from libs/lua; liblua5.4-dev only serves MoonScript's rocks.
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            luarocks \
            liblua5.4-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            xvfb

      - name: Install MoonScript
        run: |
          ROCKS_TREE="$HOME/.luarocks"
          sudo luarocks --lua-version=5.4 --tree="$ROCKS_TREE" install argparse
          sudo luarocks --lua-version=5.4 --tree="$ROCKS_TREE" install moonscript
          echo "LUA_PATH=$ROCKS_TREE/share/lua/5.4/?.lua;$ROCKS_TREE/share/lua/5.4/?/init.lua;;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$ROCKS_TREE/lib/lua/5.4/?.so;;" >> "$GITHUB_ENV"

      - name: Test (headless layout)
        run: make test-headless

      - name: Test (display required)
        run: xvfb-run make test
