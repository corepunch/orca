// The native library, assets and manifest are staged by tools/android/Makefile
// under -PorcaBuild; this project only adds the Java activity and packages them.
plugins { id 'com.android.application' }

def staged = file(project.findProperty('orcaBuild') ?: "$rootDir/../../../build/android/gradle")

android {
    namespace 'org.orca'
    compileSdk 35
    defaultConfig {
        applicationId project.findProperty('orcaApplicationId') ?: 'org.orca.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets.main {
        manifest.srcFile new File(staged, 'AndroidManifest.xml')
        assets.srcDirs = [new File(staged, 'assets')]
        jniLibs.srcDirs = [new File(staged, 'jniLibs')]
        java.srcDirs = ['src/main/java']
    }
    // Keep dot-files and _folders: the engine unpacks every listed asset.
    androidResources { ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
